# Default configuration for the 24/7 camera monitoring agent.
#
# Every key here can be overridden on the command line (`qwen25vl-agent run --help`), and a
# copy of this file can be pointed at with `--config`.  Values are grouped by the module that
# reads them; see src/qwen25vl_agent/config.py for the exact fields.

llm:
  # A *running* qwen25vl-lite `serve` instance.  The agent never loads a second copy of the
  # model: on an 8 GB card the served model already holds ~5.9 GB, so a second instance OOMs.
  url: http://127.0.0.1:8081
  model: Qwen2.5-VL-3B-Instruct
  max_tokens: 256
  temperature: 0.0
  timeout: 120.0
  # Vision budget is a *request-body* field (server `--vision-tier` does not change pixels).
  # 128 tokens keeps a frame near the ~130 ms prefill floor while still describing a scene.
  max_vision_tokens: 128
  # Text-only OpenAI-compatible endpoint used for the hourly summary, where no image is needed.
  # On this machine that is a locally served Qwen3.5-4B (see scripts/serve_qwen35.sh): the VL
  # model stays on the card describing frames, and the summary runs on CPU where there is room.
  # Set to null to fall back to the vision engine for summaries as well.
  text_url: http://127.0.0.1:8082
  text_model: Qwen3.5-4B

camera:
  device: 0          # /dev/video<device>; 0 is the 640x480 capture node on this machine
  width: 640         # request width from the driver
  jpeg_quality: 85   # ~44 KB at 640x480 vs ~600 KB for PNG
  # Degrees clockwise to rotate each frame before face detection and the VL model see it.
  # This machine's camera is mounted upside-down: the frame looks plausible either way, but
  # YuNet detects 0 faces on the raw frame and 1 face (0.82) on the 180-rotated one, and the
  # VL model reads the inverted scene as "blurry, nothing recognisable".  0/90/180/270.
  rotate: 180

audio:
  enabled: true
  # `arecord -l` on this machine: card 1 (sof-hda-dsp) device 0 = analog jack, device 6 = DMIC.
  # Measured here: the analog jack is empty (`Mic Jack` = off) and yields -87 dBFS of ADC noise,
  # while the internal DMIC array hears the room at -50 dBFS -- so DMIC is the working input.
  # NOTE: `Dmic0 Capture Switch` must be on, or the DMIC returns digital silence (all zeros):
  #   amixer -c 1 cset numid=63 on
  device: "plughw:1,6"
  rate: 16000
  channels: 1
  chunk_ms: 32
  vad:
    # Energy-based voice activity detection.  Thresholds come from a loopback measurement on
    # this machine: room floor -50 dBFS, speech through the speakers -18..-44 dBFS.
    start_db: -40.0        # a chunk this far above the floor starts speech
    hangover_ms: 400       # keep collecting this long after energy drops
    min_speech_ms: 300     # discard shorter bursts as noise
    max_segment_s: 20.0    # force-cut long speech so ASR stays responsive

asr:
  backend: funasr          # funasr | none
  model: iic/SenseVoiceSmall
  language: auto           # SenseVoice reports the spoken language; this drives 语言识别
  use_itn: true            # inverse text normalization (numbers, punctuation)

speaker:
  backend: funasr          # funasr | none
  model: iic/speech_campplus_sv_zh-cn_16k-common
  threshold: 0.65          # cosine similarity above which two voiceprints are one person

face:
  detector_model: models/face_detection_yunet_2023mar.onnx
  recognizer_model: models/face_recognition_sface_2021dec.onnx
  detect_score: 0.6        # YuNet confidence threshold
  match_threshold: 0.363   # SFace's published cosine threshold for "same identity"
  min_face_px: 48          # ignore faces smaller than this (too small to embed reliably)

identity:
  # How to fuse the two modalities when deciding whether an observation is a known person.
  # "any"   -> match on face OR voice
  # "both"  -> require both (stricter; good when both are reliably present)
  # "prefer_face" -> use face when available, else voice
  mode: prefer_face

monitor:
  tick_interval: 0.5         # perception cadence (face detect + working memory)
  describe_interval: 12.0    # seconds between VL "scene" calls; a frame costs ~0.6 s
  describe_on_event: true    # also call the VL model when a new/unknown face or speech arrives
  min_describe_gap: 2.0      # floor between two VL calls, even when events fire
  save_frames: true          # archive the frame that each episode points at
  frame_retention_days: 3
  # The same set of people may vanish and return within this window and still count as one
  # presence episode (its end time is pushed forward instead of a near-duplicate row being
  # written).  Keeps flickering detections from flooding episodic memory.
  face_presence_merge_s: 300.0

memory:
  path: ~/.qwen25vl-agent/memory.db
  archive_dir: ~/.qwen25vl-agent/archive
  working_size: 40           # observations kept in the in-process ring buffer
  working_ttl_s: 300.0
  episode_retention_days: 30
  observation_retention_days: 7
  # Cap the on-disk archive so a 24/7 run cannot fill the disk.
  archive_max_mb: 2048

alerts:
  webhook: null              # optional POST target; nothing is sent unless set
  log_path: ~/.qwen25vl-agent/alerts.log
  min_importance: 0.5        # procedural rules below this are recorded, not alerted

summary:
  enabled: true
  interval_s: 3600.0         # one broadcast per hour
  window_s: 3600.0           # how much memory it reads each time
  max_items: 200             # cap the rows pulled from memory
  min_items: 1               # a window this empty is skipped rather than announced as "nothing"
  retry_s: 300.0             # a failed broadcast is retried after this long, not a whole hour
  speak: true                # read the summary aloud

tts:
  enabled: true
  # auto -> piper, else edge-tts, else espeak-ng, else spd-say.  `edge` needs the network at
  # speak time but gives the best Chinese; `piper` is offline but needs a voice .onnx.
  backend: auto
  voice: zh-CN-XiaoxiaoNeural   # edge voice name; for backend=piper this is the .onnx path
  player: auto                  # auto -> pw-play, paplay, ffplay, aplay
  rate: "+0%"
  espeak_voice: cmn             # used only by backend=espeak
  max_chars: 400                # keep one broadcast short
  timeout: 60.0
  command: null                 # backend=command: shell template with {text} and {out}

web:
  # The optional frontend (`qwen25vl-agent web`).  8090 keeps clear of the vision server (8081)
  # and the text server (8082).  host stays on loopback: the UI can enroll people and trigger
  # speech, so it should not be reachable from the LAN unless you mean it.
  host: 127.0.0.1
  port: 8090
