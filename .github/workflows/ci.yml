name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Byte-compile every module
        run: python -m compileall -q src

      # The suite is hermetic: audio is off, hardware paths are faked or skipped, and every
      # database lives in a pytest tmp_path -- so it needs no camera, microphone or engine.
      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: CLI smoke test
        run: |
          qwen25vl-agent --help >/dev/null
          qwen25vl-agent mem --what stats --db /tmp/ci.db --json >/dev/null
