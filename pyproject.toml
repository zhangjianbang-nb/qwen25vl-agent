[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen25vl-agent"
version = "0.1.0"
description = "A 24/7 camera monitoring agent: video + speech + face perception, Qwen2.5-VL reasoning, and a five-part multimodal memory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "qwen25vl-agent contributors" }]
keywords = ["qwen2.5-vl", "agent", "video-monitoring", "face-recognition", "speaker-recognition", "memory"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The runtime path deliberately stays small.  The heavy perception backends (funasr for ASR
# and speaker embeddings) are extras, because a text-only or face-only deployment should not
# be forced to pull librosa/numba/scikit-learn.
dependencies = [
  "numpy>=1.23",
  "pillow>=9.0",
  "opencv-python-headless>=4.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Speech recognition (SenseVoice) and speaker embeddings (CAM++) both come from funasr.
# `modelscope` is funasr's model hub; on a China network it is far more reliable than
# huggingface.co, which is why the model ids below are modelscope ids.
asr = ["funasr>=1.1", "modelscope>=1.9"]
dev = ["pytest>=7.0"]

[project.scripts]
qwen25vl-agent = "qwen25vl_agent.cli:main"

[project.urls]
Homepage = "https://github.com/zhangjianbang-nb/qwen25vl-agent"
# The reasoning engine this agent drives.
Engine = "https://github.com/zhangjianbang-nb/qwen25vl-lite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning"]
